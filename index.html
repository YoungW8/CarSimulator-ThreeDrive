<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302142">
  <link rel="icon" href="data:,">
  <title>City Bus</title>
  <script type="module" crossorigin src="./assets/index-B5yzCvZG.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CHi1ttUW.css">
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f4a720" stroke="#84460b" stroke-width="2"/><circle cx="12" cy="12" r="7.8" fill="none" stroke="#fff1a8" stroke-width="1.5"/><path d="m12 5.8 1.8 3.8 4.3.5-3.2 3 .9 4.2-3.8-2.1-3.8 2.1.9-4.2-3.2-3 4.3-.5Z" fill="#fff3a0"/></symbol>
    <symbol id="icon-crate" viewBox="0 0 24 24"><path d="m2 6 10-4 10 4v13l-10 4-10-4Z" fill="#e3a85f" stroke="#77442b" stroke-width="1.6" stroke-linejoin="round"/><path d="m2 6 10 4 10-4M12 10v12M5 9l5 9m4 1 6-10" fill="none" stroke="#875232" stroke-width="1.8"/><path d="m6.4 4.2 10 4" stroke="#fff0bd" stroke-width="2"/></symbol>
    <defs>
      <linearGradient id="bus-body" x2="0" y2="1"><stop stop-color="#a2fff0"/><stop offset=".48" stop-color="#59d8cf"/><stop offset="1" stop-color="#2f9ba8"/></linearGradient>
      <linearGradient id="trophy-metal" x2="0" y2="1"><stop stop-color="#fff1a4"/><stop offset=".52" stop-color="#ffcf59"/><stop offset="1" stop-color="#e88930"/></linearGradient>
    </defs>
    <symbol id="icon-gear" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="m10 2-.6 2.5-1.9.8-2.2-1.4-2.4 2.5 1.3 2.2-.8 1.9L1 11v3l2.5.6.8 1.9-1.3 2.2 2.4 2.4 2.2-1.3 1.9.8.6 2.4h3.8l.6-2.4 1.9-.8 2.2 1.3 2.4-2.4-1.3-2.2.8-1.9L23 14v-3l-2.5-.6-.8-1.9L21 6.3l-2.4-2.5-2.2 1.4-1.9-.8L14 2zm2 6a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 .2 6M20 3v6h-6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-bus" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="18" rx="4" fill="url(#bus-body)"/><path d="M7 6h10v6H7z" fill="#2a3454"/><path d="M7 19v2m10-2v2" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M7 16h2m6 0h2" stroke="#fff0a0" stroke-width="2"/></symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 23S3 13.8 3 9a9 9 0 1 1 18 0c0 4.8-9 14-9 14Zm0-18a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></symbol>
    <symbol id="icon-cup" viewBox="0 0 24 24"><path fill="url(#trophy-metal)" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M6 5H2v3c0 3 2 5 6 5m10-8h4v3c0 3-2 5-6 5M7 3h10v6c0 8-10 8-10 0zm5 12v5m-5 1h10"/></symbol>
  </svg>
  <section id="main-menu" aria-label="City Bus">
    <div id="menu-actions">
      <h1 class="game-title"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-bus"/></svg> Bus Driver</h1>
      <button id="play" type="button" data-i18n="menu.play">Play</button>
    </div>
    <button id="menu-options" class="settings-button" type="button" data-i18n-label="settings.title"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-gear"/></svg></button>
    <dialog id="menu-options-panel" class="menu-options-panel" aria-labelledby="menu-options-title">
      <h2 id="menu-options-title" data-i18n="settings.title">Settings</h2>
      <label id="menu-language">
        <span data-i18n="menu.language">Language</span>
        <select id="language">
          <option value="en" lang="en">English</option>
          <option value="es" lang="es">Español</option>
          <option value="tr" lang="tr">Türkçe</option>
          <option value="de" lang="de">Deutsch</option>
          <option value="fr" lang="fr">Français</option>
          <option value="it" lang="it">Italiano</option>
        </select>
      </label>
      <form method="dialog"><button class="primary-action" data-i18n="settings.resume">Continue</button></form>
    </dialog>
    <section id="loading" aria-labelledby="loading-title" hidden>
      <div class="loading-card">
        <div id="loading-wheel-background" aria-hidden="true"></div>
        <div id="loading-wheel" aria-hidden="true"></div>
        <h1 id="loading-title" class="sr-only" data-i18n="loading.title">Loading the route…</h1>
        <p id="loading-detail" role="status"></p>
        <div id="loading-line" aria-hidden="true"><span></span></div>
        <progress id="loading-progress" aria-labelledby="loading-title"></progress>
        <button id="loading-retry" class="primary-action" type="button" data-i18n="menu.retry" hidden>Retry</button>
      </div>
    </section>
  </section>
  <main id="drive" tabindex="-1" class="city-view" data-i18n-label="game.label" hidden inert>
    <div class="hud">
      <section id="trip-minimap" data-i18n-label="hud.map" hidden>
        <canvas width="288" height="288" role="img" data-i18n-label="hud.mapDescription"></canvas>
        <span class="minimap-notice" data-i18n="hud.offRoute" hidden>Off route</span>
      </section>
      <header class="location">
        <h1>City Bus</h1>
      </header>
      <div class="mission-layout"><div class="mission">
        <span class="route" id="drive-mode"></span>
        <div id="trip-progress" class="route-progress" role="progressbar" data-i18n-label="hud.progress" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" hidden>
          <span id="trip-progress-fill"></span>
        </div>
        <span id="trip-count" aria-hidden="true"></span>
        <div class="stop-line" aria-hidden="true">
          <span id="stop-caption" data-i18n="hud.nextStop">Next Stop:</span>
          <span id="next-stop"></span>
        </div>
        <div id="trip-status" class="sr-only" role="status" hidden></div>
        <div class="city-objectives">
          <span data-i18n-title="hud.wallet"><span class="sr-only" data-i18n="hud.wallet">Money</span><b aria-hidden="true">$</b> <strong id="wallet-total">0</strong></span>
          <span data-i18n-title="hud.coins"><span class="sr-only" data-i18n="hud.coins">Collect coins</span><svg aria-hidden="true" class="objective-icon"><use href="#icon-coin"/></svg> <span id="coin-total">0</span>/100</span>
          <span data-i18n-title="hud.crates"><span class="sr-only" data-i18n="hud.crates">Break crates</span><svg aria-hidden="true" class="objective-icon"><use href="#icon-crate"/></svg> <span id="crate-total">0</span>/20</span>
        </div>
      </div></div>
      <div id="trip-notice" class="trip-notice" role="status" hidden></div>
      <div id="route-area" class="route-area" hidden>
        <span id="route-area-message" role="status"></span>
        <button id="route-area-retry" type="button" data-i18n="menu.retry" hidden>Retry</button>
      </div>
      <button id="settings" class="settings-button" type="button" data-i18n-label="settings.title" data-i18n-title="settings.title" data-shortcut="Esc" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-gear"/></svg></button>
      <div class="vehicle-actions">
        <button id="horn" type="button" aria-keyshortcuts="H" data-i18n-label="hud.horn" data-i18n-title="hud.horn" data-shortcut="H">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path fill="currentColor" stroke="none" d="M2 10h5v1h3c3 0 6-2 9-5v14c-3-3-6-5-9-5H7v1H2z"/>
            <path d="M21.5 6v13M8 15v4h4"/>
          </svg>
          <span data-i18n="hud.horn">Horn</span>
        </button>
        <button id="reset" type="button" data-i18n-label="hud.reset" data-i18n-title="hud.reset" data-shortcut="R"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-reset"/></svg><span data-i18n="hud.resetShort">Reset</span></button>
        <button id="camera" type="button" data-i18n-label="hud.camera" aria-pressed="false" data-i18n-title="hud.camera" data-shortcut="C">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <use href="#icon-bus" x="-2" y="5" width="20" height="20" stroke="none"/>
            <path d="M6 3h8a7 7 0 0 1 7 7v2m-3-3 3 3 2-3"/>
          </svg>
          <span data-i18n="hud.viewShort">View</span>
        </button>
      </div>
      <div class="debug-tools">
          <span class="fps" data-i18n-label="hud.fps"><span id="fps">—</span> FPS</span>
          <button id="overview" type="button" data-i18n-title="hud.overview" data-shortcut="M">Drive</button>
          <button id="collider" type="button" aria-pressed="false" data-i18n="hud.collider" data-i18n-title="hud.collider" data-shortcut="V">Collider</button>
      </div>
    </div>
    <div class="speed" data-i18n-label="hud.speed">
      <span id="speed-fill" aria-hidden="true"></span>
      <div class="readout"><small data-i18n="hud.speedUnit">km/h</small><span id="speed">0</span></div>
      <span id="gear" class="gear" data-i18n-label="hud.gear">D</span>
    </div>
    <button id="trip-doors" type="button" aria-keyshortcuts="Space" data-i18n-title="hud.doors" data-shortcut-label="input.space" hidden disabled><span class="sr-only">Open the doors</span><span class="door-key" aria-hidden="true"><span data-i18n="hud.press">Press</span><kbd data-i18n="input.space">Space</kbd></span></button>
    <div class="touch" data-i18n-label="input.touch">
      <div><button type="button" data-key="KeyA" data-i18n-label="input.left"></button><button type="button" data-key="KeyD" data-i18n-label="input.right"></button></div>
      <div><button type="button" data-key="KeyS" data-i18n-label="input.brake"></button><button type="button" data-key="KeyW" data-i18n-label="input.accelerate"></button></div>
    </div>
    <div id="tutorial-prompt" role="status" hidden><span id="tutorial-keys"></span><span id="tutorial-instruction"></span></div>
    <div id="tutorial-finger" aria-hidden="true" hidden></div>
    <dialog id="settings-popup" class="popup settings-popup" aria-labelledby="settings-title">
      <div class="pause-card">
        <h2 id="settings-title"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-gear"/></svg><span data-i18n="settings.title">Settings</span></h2>
        <label class="setting"><span data-i18n="settings.graphics">Graphics</span>
        <select id="graphics-quality">
          <option value="auto" data-i18n="settings.auto">Auto</option>
          <option value="low" data-i18n="settings.low">Low</option>
          <option value="high" data-i18n="settings.high">High</option>
        </select>
        </label>
        <label class="setting"><span data-i18n="settings.effects">Sound effects</span>
          <input id="effects-volume" type="range" min="0" max="100" step="1">
        </label>
        <div class="trip-actions">
          <button id="roadmap-button" type="button" data-i18n-label="roadmap.title" data-i18n-title="roadmap.title"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-pin"/></svg><span data-i18n="roadmap.title">Progress map</span></button>
          <button id="restart-trip" type="button" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-reset"/></svg><span data-i18n="settings.restartShort">Restart</span></button>
        </div>
        <button id="resume" class="primary-action" type="button" data-i18n="settings.continue" autofocus>Continue</button>
      </div>
      <section id="restart-confirm" hidden>
        <h2 data-i18n="settings.confirm">Restart?</h2>
        <button id="restart-yes" type="button" data-i18n="settings.yes">Yes</button>
        <button id="restart-no" type="button" data-i18n="settings.no">No</button>
      </section>
    </dialog>
    <dialog id="victory-popup" class="popup victory-popup" aria-labelledby="victory-title">
      <div class="victory-content">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-cup"/></svg>
        <h2 id="victory-title" data-i18n="results.wellDone">Well Done</h2>
        <p id="victory-route"></p>
        <dl>
          <div><dt data-i18n="results.stops">Stops</dt><dd id="victory-stops"></dd></div>
          <div><dt data-i18n="results.passengers">Passengers</dt><dd id="victory-passengers"></dd></div>
        </dl>
        <p id="victory-load-status" role="status" hidden></p>
        <button id="next-trip" class="primary-action" type="button" data-i18n="results.next" hidden>Next route</button>
      </div>
    </dialog>
    <dialog id="roadmap-popup" class="popup roadmap-popup" aria-labelledby="roadmap-title">
      <h2 id="roadmap-title" data-i18n="roadmap.title">Progress map</h2>
      <div class="roadmap-scroll">
        <ol id="roadmap-routes"></ol>

      </div>
      <button id="roadmap-close" type="button" data-i18n="settings.continue" autofocus>Continue</button>
    </dialog>
  </main>
</body>
</html>
