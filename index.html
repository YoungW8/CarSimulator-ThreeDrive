<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15252c">
  <link rel="icon" href="data:,">
  <title>City Bus · Simpligon Pilot</title>
  <script type="module" crossorigin src="./assets/index-B9F9W2lZ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BusPTCOK.css">
</head>
<body>
  <main id="drive" class="city-view" aria-label="Симулятор автобуса">
    <div class="hud">
      <header class="location">
        <h1>City Bus</h1>
      </header>
      <div class="mission">
        <span class="route" id="drive-mode">Свободная езда</span>
        <div id="trip-progress" class="route-progress" role="progressbar" aria-label="Остановки пройдены" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" hidden>
          <span id="trip-progress-fill"></span>
        </div>
        <div id="trip-status" class="trip-status" role="status" hidden></div>
        <div class="trip-actions">
          <button id="start-trip" type="button" hidden>Начать рейс</button>
          <button id="free-drive" type="button" hidden>Свободная езда</button>
        </div>
      </div>
      <div id="trip-notice" class="trip-notice" role="status" hidden></div>
      <div class="tools">
        <button id="settings" class="settings-button" type="button" aria-label="Настройки" title="Настройки · Esc" hidden></button>
        <div class="tool-buttons">
          <span class="fps" aria-label="Кадров в секунду"><span id="fps">—</span> FPS</span>
          <button id="overview" type="button" aria-label="Переключить обзор города" title="Обзор города · M">За руль</button>
          <button id="camera" type="button" aria-label="Сменить камеру" aria-pressed="false" title="Сменить камеру · C">Кабина</button>
          <button id="collider" type="button" aria-pressed="false" title="Контур коллайдера · V">Коллайдер</button>
          <button id="reset" type="button" aria-label="Переместить автобус на ближайшую свободную дорогу" title="Вернуться на дорогу · R"></button>
        </div>
        <section id="trip-minimap" aria-label="Мини-карта рейса" hidden>
          <canvas width="288" height="288" role="img" aria-label="Положение автобуса, его направление и путь к остановке"></canvas>
          <span class="minimap-notice" hidden>Вне маршрута</span>
        </section>
      </div>
    </div>
    <div class="speed" aria-label="Скорость">
      <span id="speed-fill" aria-hidden="true"></span>
      <div class="readout"><small>км/ч</small><span id="speed">0</span></div>
      <span id="gear" class="gear" aria-label="Направление движения">D</span>
    </div>
    <button id="trip-doors" type="button" aria-keyshortcuts="Space" title="Двери · Пробел" hidden disabled><span class="sr-only">Открыть двери</span></button>
    <div class="keys"><span><kbd>W</kbd><kbd>S</kbd> газ / тормоз и задний ход</span><span><kbd>A</kbd><kbd>D</kbd> руль</span><span><kbd>Пробел</kbd> двери</span></div>
    <div class="touch" aria-label="Управление на сенсорном экране">
      <div><button type="button" data-key="KeyA" aria-label="Руль влево"></button><button type="button" data-key="KeyD" aria-label="Руль вправо"></button></div>
      <div><button type="button" data-key="KeyS" aria-label="Тормоз и задний ход"></button><button type="button" data-key="KeyW" aria-label="Газ"></button></div>
    </div>
    <dialog id="settings-popup" class="popup settings-popup" aria-labelledby="settings-title">
      <h2 id="settings-title">Настройки</h2>
      <label class="setting">Графика
        <select id="graphics-quality">
          <option value="auto">Авто</option>
          <option value="low">Низкая</option>
          <option value="high">Высокая</option>
        </select>
      </label>
      <button id="resume" class="yellow-button" type="button" autofocus>Продолжить</button>
      <button id="restart-trip" type="button" hidden>Начать рейс заново</button>
    </dialog>
    <dialog id="victory-popup" class="popup victory-popup" aria-labelledby="victory-title">
      <div class="victory-content">
        <h2 id="victory-title">Рейс завершён</h2>
        <p id="victory-route"></p>
        <dl>
          <div><dt>Остановки</dt><dd id="victory-stops"></dd></div>
          <div><dt>Пассажиры</dt><dd id="victory-passengers"></dd></div>
        </dl>
        <button id="repeat-trip" class="yellow-button next-button" type="button" autofocus>Повторить рейс</button>
        <button id="victory-free-drive" type="button">Свободная езда</button>
      </div>
    </dialog>
    <div id="loading" class="loading" role="status">Загружаем город…</div>
  </main>
</body>
</html>
